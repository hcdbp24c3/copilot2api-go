name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install
          pnpm build

      - name: Build binaries (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o copilot-go-linux-amd64 .

      - name: Build binaries (linux/arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o copilot-go-linux-arm64 .

      - name: Build binaries (darwin/amd64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o copilot-go-darwin-amd64 .

      - name: Build binaries (darwin/arm64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o copilot-go-darwin-arm64 .

      - name: Build binaries (windows/amd64)
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o copilot-go-windows-amd64.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            copilot-go-linux-amd64
            copilot-go-linux-arm64
            copilot-go-darwin-amd64
            copilot-go-darwin-arm64
            copilot-go-windows-amd64.exe
          body: |
            ## 🐳 Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            **Docker Compose:**

            ```yaml
            services:
              copilot-go:
                image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
                container_name: copilot-go
                restart: unless-stopped
                ports:
                  - "3000:3000"
                  - "4141:4141"
                volumes:
                  - copilot-data:/root/.local/share/copilot-api
                environment:
                  - TZ=Asia/Shanghai

            volumes:
              copilot-data:
            ```

            ---

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker release body
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 🐳 Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            **Docker Compose:**

            ```yaml
            services:
              copilot-go:
                image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
                container_name: copilot-go
                restart: unless-stopped
                ports:
                  - "3000:3000"
                  - "4141:4141"
                volumes:
                  - copilot-data:/root/.local/share/copilot-api
                environment:
                  - TZ=Asia/Shanghai

            volumes:
              copilot-data:
            ```

            ---
